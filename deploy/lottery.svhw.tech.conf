server {
    listen 80;
    listen [::]:80;
    server_name lottery.svhw.tech;

    root /var/www/photo-lottery/current;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
